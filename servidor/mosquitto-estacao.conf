# Configuracao do broker Mosquitto para a estacao meteorologica.
#
# Instale copiando para a pasta de configuracoes do Mosquitto e reiniciando:
#
#     sudo cp servidor/mosquitto-estacao.conf /etc/mosquitto/conf.d/estacao.conf
#     sudo systemctl restart mosquitto
#
# POR QUE ESTE ARQUIVO EXISTE: o Mosquitto 2.0 mudou os padroes de fabrica.
# Sem configuracao ele escuta SOMENTE em localhost e recusa cliente anonimo.
# O ESP32 vem de outra maquina da rede, entao sem isto ele nunca conecta -
# e o erro aparece como "Connection refused" no ESP32, sem nada util no log.
#
# ATENCAO ao editar: o /etc/mosquitto/mosquitto.conf do Ubuntu ja define
# persistence, persistence_location e log_dest. Repetir qualquer uma dessas
# chaves aqui e ERRO FATAL - o broker recusa a subir com
# "Duplicate <chave> value in configuration". Este arquivo so pode conter o
# que o principal ainda nao definiu.

# Escuta em todas as interfaces de rede, nao so localhost.
listener 1883 0.0.0.0

# Aceita cliente sem usuario e senha.
#
# ATENCAO: isto vale para rede local domestica, onde o broker nao esta exposto
# para a internet. Antes de por este broker num VPS ou abrir porta no roteador,
# troque para autenticacao com senha e TLS na 8883 - ver docs/04-telemetria.md.
allow_anonymous true

# Conexoes simultaneas: o ESP32, o servidor Python e o que voce abrir para
# depurar com mosquitto_sub. Folga de sobra.
max_connections 20
